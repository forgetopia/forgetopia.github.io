name: Deploy FORGE to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: source
    env:
      FORGE_SITE_ORIGIN: https://forgetopia.github.io
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out deployment validation
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out public portfolio source
        uses: actions/checkout@v4
        with:
          repository: forgetopia/forge-portfolio
          ref: main
          path: source
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Validate content, hosting origins, and root paths
        run: npm run test:unit

      - name: Build GitHub Pages website
        run: npm run build

      - name: Confirm website entry point
        run: test -f dist/index.html

      - name: Validate static artifact paths and assets
        run: node ../scripts/validate-dist.mjs dist

      - name: Install Chromium for browser validation
        run: npx playwright install --with-deps chromium

      - name: Validate built routes, assets, media, and SEO
        run: npm run test:e2e

      - name: Upload complete static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: source/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
